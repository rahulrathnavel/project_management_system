name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: pms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Apply Database Migrations
      env:
        DATABASE_URL: postgresql://postgres:123@localhost:5432/pms?schema=public
      run: cd apps/api && npx prisma db push --accept-data-loss

    - name: Build Web and API
      run: npm run build

    - name: Run Backend E2E Tests
      env:
        DATABASE_URL: postgresql://postgres:123@localhost:5432/pms?schema=public
        JWT_SECRET: testing-secret
      run: npm run test:e2e --workspace=api

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Build API Docker Image
      run: docker build -t pms-api -f apps/api/Dockerfile .

    - name: Build Web Docker Image
      run: docker build -t pms-web -f apps/web/Dockerfile .

